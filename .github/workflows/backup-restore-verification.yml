name: Backup restore verification

on:
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effdesk-backup-restore-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-test-only
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:restore-test-only@localhost:5432/restore_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run repository test suite
        run: npm test

      - name: Install backup verification utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client age awscli

      - name: Find and download the newest encrypted backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          latest_key="$(aws s3 ls "s3://${R2_BUCKET}/effdesk/" --recursive --endpoint-url "$endpoint" |
            awk '$4 ~ /^effdesk\/[0-9]{4}\/[0-9]{2}\/[0-9]{2}\/[0-9]{6}\/backup\.tar\.gz\.age$/ {print $4}' |
            sort | tail -n 1)"
          if [ -z "$latest_key" ]; then
            echo "No timestamped EffDesk backup archive was found in R2."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/effdesk-restore-test"
          aws s3 cp "s3://${R2_BUCKET}/$latest_key" "$RUNNER_TEMP/effdesk-restore-test/backup.tar.gz.age" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp "s3://${R2_BUCKET}/${latest_key}.sha256" "$RUNNER_TEMP/effdesk-restore-test/backup.tar.gz.age.sha256" --endpoint-url "$endpoint" --only-show-errors
          echo "Downloaded newest backup: $latest_key"

      - name: Verify encrypted archive checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/effdesk-restore-test"
          expected="$(awk 'NR == 1 {print $1}' backup.tar.gz.age.sha256)"
          actual="$(sha256sum backup.tar.gz.age | awk '{print $1}')"
          test -n "$expected"
          if [ "$expected" != "$actual" ]; then
            echo "Encrypted backup checksum mismatch."
            exit 1
          fi
          echo "Encrypted archive checksum passed."

      - name: Decrypt and inspect backup contents
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_AGE_IDENTITY"
          identity="$RUNNER_TEMP/age-identity.txt"
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$identity"
          chmod 600 "$identity"
          age --decrypt --identity "$identity" \
            --output "$RUNNER_TEMP/effdesk-restore-test/backup.tar.gz" \
            "$RUNNER_TEMP/effdesk-restore-test/backup.tar.gz.age"
          tar -tzf "$RUNNER_TEMP/effdesk-restore-test/backup.tar.gz" | grep -Fx 'effdesk-backup/database.dump'
          tar -tzf "$RUNNER_TEMP/effdesk-restore-test/backup.tar.gz" | grep -Fx 'effdesk-backup/blobs/manifest.json'
          tar -xzf "$RUNNER_TEMP/effdesk-restore-test/backup.tar.gz" -C "$RUNNER_TEMP/effdesk-restore-test"
          test -s "$RUNNER_TEMP/effdesk-restore-test/effdesk-backup/database.dump"

      - name: Verify PostgreSQL dump can be read
        run: |
          set -euo pipefail
          pg_restore --list "$RUNNER_TEMP/effdesk-restore-test/effdesk-backup/database.dump" > "$RUNNER_TEMP/effdesk-restore-test/restore-toc.txt"
          test -s "$RUNNER_TEMP/effdesk-restore-test/restore-toc.txt"
          echo "PostgreSQL archive is readable."

      - name: Restore database into an isolated temporary PostgreSQL service
        run: |
          set -euo pipefail
          pg_restore --exit-on-error --no-owner --no-acl \
            --dbname="$TEST_DATABASE_URL" \
            "$RUNNER_TEMP/effdesk-restore-test/effdesk-backup/database.dump"
          table_count="$(psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")"
          migration_count="$(psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM public.schema_migrations")"
          test "$table_count" -gt 0
          test "$migration_count" -gt 0
          echo "Database restore passed: $table_count public tables; $migration_count recorded migrations."

      - name: Verify every attachment object and SHA-256 digest
        run: |
          set -euo pipefail
          node scripts/verify-blobs.js "$RUNNER_TEMP/effdesk-restore-test/effdesk-backup/blobs"

      - name: Remove decrypted backup material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/effdesk-restore-test" "$RUNNER_TEMP/age-identity.txt"

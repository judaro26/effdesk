name: Staging multi-tenant load test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Load profile for the selected synthetic staging workload
        required: true
        type: choice
        options:
          - smoke
          - standard
          - stress
        default: smoke
      workload:
        description: Workload type
        required: true
        type: choice
        options:
          - read-only
          - mixed-chat
          - tenant-fairness
          - multi-instance-chat
        default: read-only
      confirm_staging:
        description: Confirm the target is the dedicated staging database, never production
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: effdesk-staging-load-test
  cancel-in-progress: false

jobs:
  load-test:
    if: ${{ inputs.confirm_staging == true && inputs.workload != 'multi-instance-chat' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate staging target before connecting
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-staging.js --check

      - name: Validate mixed chat workload target
        if: ${{ inputs.workload == 'mixed-chat' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-chat-mixed.js --check

      - name: Run read-only multi-tenant workload
        if: ${{ inputs.workload == 'read-only' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-staging.js

      - name: Validate tenant fairness workload target
        if: ${{ inputs.workload == 'tenant-fairness' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-tenant-fairness.js --check

      - name: Run hot-tenant fairness workload
        if: ${{ inputs.workload == 'tenant-fairness' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-tenant-fairness.js

      - name: Run mixed visitor and agent chat workload
        if: ${{ inputs.workload == 'mixed-chat' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-chat-mixed.js

  multi-instance-chat:
    if: ${{ inputs.confirm_staging == true && inputs.workload == 'multi-instance-chat' }}
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate isolated instance workload target
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
          STAGING_BENCH_CONCURRENCY: 10
        run: node scripts/bench-chat-mixed.js --check

      - name: Align independent app instances on a shared start window
        id: start-window
        shell: bash
        run: |
          now=$(date +%s)
          start_at_ms=$(( (now / 60 + 2) * 60000 ))
          echo "start_at_ms=$start_at_ms" >> "$GITHUB_OUTPUT"

      - name: Run this independent app instance against shared staging
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
          STAGING_BENCH_CONCURRENCY: 10
          STAGING_BENCH_START_AT_MS: ${{ steps.start-window.outputs.start_at_ms }}
          BENCH_INSTANCE: ${{ matrix.instance }}
        run: |
          echo "Starting independent benchmark instance $BENCH_INSTANCE with concurrency 10"
          node scripts/bench-chat-mixed.js

name: Staging multi-tenant load test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Load profile for the selected synthetic staging workload
        required: true
        type: choice
        options:
          - smoke
          - standard
          - stress
        default: smoke
      workload:
        description: Workload type
        required: true
        type: choice
        options:
          - read-only
          - mixed-chat
        default: read-only
      confirm_staging:
        description: Confirm the target is the dedicated staging database, never production
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: effdesk-staging-load-test
  cancel-in-progress: false

jobs:
  load-test:
    if: ${{ inputs.confirm_staging == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate staging target before connecting
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-staging.js --check

      - name: Validate mixed chat workload target
        if: ${{ inputs.workload == 'mixed-chat' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-chat-mixed.js --check

      - name: Run read-only multi-tenant workload
        if: ${{ inputs.workload == 'read-only' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-staging.js

      - name: Run mixed visitor and agent chat workload
        if: ${{ inputs.workload == 'mixed-chat' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_ORG_IDS: ${{ vars.STAGING_ORG_IDS }}
          STAGING_BENCH_PROFILE: ${{ inputs.profile }}
        run: node scripts/bench-chat-mixed.js


name: Isolated Netlify Blobs restore drill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effdesk-netlify-blobs-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install restore utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age awscli

      - name: Download newest encrypted backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          latest_key="$(aws s3 ls "s3://${R2_BUCKET}/effdesk/" --recursive --endpoint-url "$endpoint" |
            awk '$4 ~ /^effdesk\/[0-9]{4}\/[0-9]{2}\/[0-9]{2}\/[0-9]{6}\/backup\.tar\.gz\.age$/ {print $4}' |
            sort | tail -n 1)"
          if [ -z "$latest_key" ]; then
            echo "No timestamped EffDesk backup archive was found in R2."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/effdesk-blob-drill"
          aws s3 cp "s3://${R2_BUCKET}/$latest_key" "$RUNNER_TEMP/effdesk-blob-drill/backup.tar.gz.age" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp "s3://${R2_BUCKET}/${latest_key}.sha256" "$RUNNER_TEMP/effdesk-blob-drill/backup.tar.gz.age.sha256" --endpoint-url "$endpoint" --only-show-errors
          echo "Downloaded newest backup: $latest_key"

      - name: Verify checksum and decrypt archive
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_AGE_IDENTITY"
          cd "$RUNNER_TEMP/effdesk-blob-drill"
          expected="$(awk 'NR == 1 {print $1}' backup.tar.gz.age.sha256)"
          actual="$(sha256sum backup.tar.gz.age | awk '{print $1}')"
          test -n "$expected"
          test "$expected" = "$actual"
          identity="$RUNNER_TEMP/age-identity.txt"
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$identity"
          chmod 600 "$identity"
          age --decrypt --identity "$identity" --output backup.tar.gz backup.tar.gz.age
          tar -xzf backup.tar.gz
          test -s effdesk-backup/blobs/manifest.json

      - name: Restore into disposable Netlify site and verify read-back
        env:
          BLOB_RESTORE_TEST_SITE_ID: ${{ secrets.BLOB_RESTORE_TEST_SITE_ID }}
          BLOB_RESTORE_TEST_AUTH_TOKEN: ${{ secrets.BLOB_RESTORE_TEST_AUTH_TOKEN }}
          BLOB_RESTORE_TEST_CONFIRM: RESTORE_TO_DISPOSABLE_SITE
        run: |
          set -euo pipefail
          test -n "$BLOB_RESTORE_TEST_SITE_ID"
          test -n "$BLOB_RESTORE_TEST_AUTH_TOKEN"
          node scripts/test-netlify-blob-restore.js "$RUNNER_TEMP/effdesk-blob-drill/effdesk-backup/blobs"

      - name: Remove decrypted backup material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/effdesk-blob-drill" "$RUNNER_TEMP/age-identity.txt"

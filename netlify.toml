[build]
  command = "node scripts/migrate-on-build.js && (node scripts/minify-assets.js || echo minify skipped)"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]
  included_files = ["migrations/**", "node_modules/pdfjs-dist/legacy/build/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.paddle.com; frame-src https://buy.paddle.com https://sandbox-buy.paddle.com; connect-src 'self' https://checkout-service.paddle.com https://sandbox-checkout-service.paddle.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

# The chat window is the one page other websites may put in a frame (the chat button on a customer's site opens it). It runs only its own scripts and talks only to this site.
[[headers]]
  for = "/chat.html"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors *"

# A workspace's desk has its own address: /w/acme/agent/10042/tickets/57 (the page reads the workspace and ticket from the address).
[[redirects]]
  from = "/agent/*"
  to = "/desk.html"
  status = 200

[[redirects]]
  from = "/w/*"
  to = "/desk.html"
  status = 200

# Sign-in, the account page, the desk and invitations belong to the app host (the session cookie is for that host only). The marketing site links to them, and these redirects carry the visitor over.
[[redirects]]
  from = "https://effdesk.com/auth.html"
  to = "https://app.effdesk.com/auth.html"
  status = 301
  force = true

